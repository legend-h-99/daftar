# Keeps the free-tier Supabase production project active and takes an
# encrypted daily backup. The repository is public, so only an age-encrypted
# dump is ever written to disk or uploaded. See docs/DB_BACKUP_RESTORE_AR.md
# and docs/agdr/AgDR-0005-db-keepalive-encrypted-backup.md.
name: DB keep-alive and backup

on:
  schedule:
    # Off the hour: runs at minute 0 are delayed or dropped more often.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-keepalive-backup
  cancel-in-progress: false

jobs:
  keepalive-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # pg_dump must match the server major version (Postgres 17).
    container: postgres:17
    # Secrets are set per step, so apt-get and the upload action never see
    # the production database URL.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          missing=0
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL is not set (use the Session pooler URI)."
            missing=1
          fi
          case "$BACKUP_AGE_RECIPIENT" in
            age1*) ;;
            *)
              echo "::error::Secret BACKUP_AGE_RECIPIENT must be an age public key (age1...)."
              missing=1
              ;;
          esac
          exit "$missing"

      - name: Keep the database active
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          result=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select 1")
          if [ "$result" != "1" ]; then
            echo "::error::Keep-alive query did not return 1."
            exit 1
          fi
          echo "Keep-alive query succeeded."

      - name: Install age
        run: |
          apt-get update -qq
          apt-get install -y -qq age >/dev/null
          age --version

      - name: Dump and encrypt
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          mkdir -p backup
          file="backup/daftar-$(date -u +%Y-%m-%dT%H%MZ).dump.age"
          # Stream straight into age so no plaintext dump touches the disk.
          pg_dump "$SUPABASE_DB_URL" \
              --format=custom \
              --no-owner \
              --no-privileges \
              --schema=public \
              --schema=auth \
            | age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" --output "$file"
          size=$(stat -c %s "$file")
          if [ "$size" -lt 1024 ]; then
            echo "::error::Encrypted backup is only ${size} bytes; the dump is likely empty."
            exit 1
          fi
          echo "Encrypted backup size: ${size} bytes"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 30
          if-no-files-found: error
