name: Operations room
on:
  pull_request:
    paths: ['apps/operations/**', 'pnpm-lock.yaml', '.github/workflows/operations.yml']
  push:
    branches: [main]
    paths: ['apps/operations/**', 'pnpm-lock.yaml', '.github/workflows/operations.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daftar/operations typecheck
      - run: pnpm --filter @daftar/operations test
      - run: pnpm --filter @daftar/operations build
      - run: pnpm --filter @daftar/operations exec playwright install --with-deps chromium
      - run: pnpm --filter @daftar/operations test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: operations-browser
          path: test-results/operations/
