name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mobile-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - run: pnpm install --frozen-lockfile
      - name: Audit workspace dependencies for high and critical advisories
        run: pnpm audit --prod --audit-level high
      - name: Verify parser and Metro compatibility
        run: node --test apps/mobile/test/dependency-security.test.cjs
      - name: Type-check mobile
        run: pnpm --filter @daftar/mobile type-check
      - name: Build Android and iOS Hermes bundles
        run: pnpm --filter @daftar/mobile exec expo export --platform ios --platform android --output-dir dist-security --max-workers 2
        env:
          CI: "true"

  scale-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daftar_scale
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/daftar_scale
      JWT_SECRET: isolated-scale-ci-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api db:seed:scale
      - run: pnpm --filter api test:scale

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit deployed web dependencies
        run: node apps/web/test/release-audit.mjs

      - name: Lint web
        run: pnpm --filter web lint

      - name: Test web
        run: pnpm --filter web test -- --run

      - name: Install test browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Test session cookies in the browser
        run: pnpm --filter web test:session

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Test API
        run: pnpm --filter api test --runInBand

      - name: Type-check API including test tooling
        run: pnpm --filter api exec tsc --noEmit

      - name: Test Supabase material and activation contracts
        run: node --test supabase/functions/api/material-create.test.cjs supabase/functions/api/activation-analytics.test.cjs

      - name: Build API
        run: pnpm --filter api build

      - name: Build web
        run: pnpm --filter web build

      - name: Build Cloudflare static release
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_APP_ENV: "production"
          NEXT_PUBLIC_DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_LOGIN: "false"
          NEXT_PUBLIC_EMAIL_LOGIN_ENABLED: "false"
          NEXT_PUBLIC_PHONE_LOGIN_ENABLED: "true"
          NEXT_PUBLIC_SESSION_PROXY_ENABLED: "true"
          NEXT_OUTPUT_EXPORT: "1"
          NEXT_DIST_DIR: ".next-cloudflare-check"
          NEXT_PUBLIC_API_URL: "https://nklcbcpkycrhuumpbksb.supabase.co/functions/v1/api"

      - name: Test static release UX (synthetic API only)
        run: pnpm --filter web test:ux:release
        env:
          UX_PHONE_LOGIN_ENABLED: "true"

      - name: Test anonymous customer behavior
        run: pnpm --filter web test:behavior
        env:
          QA_STATIC_DIR: ".next-cloudflare-check"

      - name: Test first expense activation
        run: pnpm --filter web exec node test/ux/first-expense-browser.mjs
        env:
          QA_STATIC_DIR: ".next-cloudflare-check"

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-qa
          path: |
            test-results/ux-release/
            test-results/session-browser/
            test-results/behavior-browser/

  financial-integrity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        existing-ledger: ["false", "true"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daftar_audit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUDIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daftar_audit_ci
      AUDIT_BASELINE_LEDGER: ${{ matrix.existing-ledger }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap the production schema fixture and apply remediation migrations
        run: python3 tests/red-team/bootstrap-audit.py
      - name: Exercise financial rollback, concurrency and tenant boundaries
        run: python3 tests/red-team/audit-remediation.py
