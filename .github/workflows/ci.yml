name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit deployed web dependencies
        run: node apps/web/test/release-audit.mjs

      - name: Test web
        run: pnpm --filter web test -- --run

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Test API
        run: pnpm --filter api test --runInBand

      - name: Build API
        run: pnpm --filter api build

      - name: Build web
        run: pnpm --filter web build

      - name: Build Cloudflare static release
        run: pnpm --filter web build
        env:
          NEXT_OUTPUT_EXPORT: "1"
          NEXT_DIST_DIR: ".next-cloudflare-check"
          NEXT_PUBLIC_API_URL: "https://nklcbcpkycrhuumpbksb.supabase.co/functions/v1/api"
