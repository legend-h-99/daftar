<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سلسلة دفتر البصرية — 20 صورة</title><style>
@font-face{font-family:Tajawal;font-weight:500;src:url(fonts/Tajawal_500Medium.ttf)}@font-face{font-family:Tajawal;font-weight:800;src:url(fonts/Tajawal_800ExtraBold.ttf)}*{box-sizing:border-box}body{margin:0;background:#edf2ef;font-family:Tajawal,sans-serif;color:#14211c}.wrap{max-width:760px;margin:24px auto;padding:0 16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h1{font-size:22px;margin:0}.head span{color:#607069}.stage{position:relative;background:#111;border-radius:18px;overflow:hidden;aspect-ratio:4/5;box-shadow:0 18px 55px #0f73532b}.stage img{width:100%;height:100%;object-fit:contain;display:block}.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;background:#ffffffe8;font-size:26px;cursor:pointer}.prev{right:12px}.next{left:12px}.count{position:absolute;top:12px;left:12px;background:#14211cbb;color:#fff;border-radius:999px;padding:7px 12px;direction:ltr}.thumbs{direction:ltr;display:flex;gap:10px;overflow-x:auto;padding:14px 2px 10px;scroll-snap-type:x proximity}.thumbs button{flex:0 0 74px;width:74px;height:92px;padding:0;border:3px solid transparent;border-radius:10px;overflow:hidden;background:#fff;cursor:pointer;opacity:.65;scroll-snap-align:center}.thumbs button.on{border-color:#0f7353;opacity:1}.thumbs img{width:100%;height:100%;object-fit:cover}.cap{background:#fff;border-radius:14px;padding:16px 18px;margin-top:6px;white-space:pre-line;line-height:1.6}.hint{text-align:center;color:#607069;font-size:14px;margin:8px}
</style></head><body><main class="wrap"><div class="head"><h1>سلسلة «دفتر» البصرية</h1><span>معاينة غير منشورة</span></div><div class="stage"><img id="main" alt=""><button class="nav prev" id="prev">›</button><button class="nav next" id="next">‹</button><span class="count" id="count"></span></div><div class="thumbs" id="thumbs"></div><p class="hint">اسحب شريط الصور المصغرة أو انقر للتنقل</p><div class="cap" id="cap"></div></main><script>
const tweets=["كل شيء كان مكتوبًا… ومع ذلك، اختفى نصف الربح. هذه قصة مشروع منزلي في 20 صورة. 🧵 1/20","بدأ اليوم بطلب بسيط: كيكة شوكولاتة بـ150 ريال. 2/20","انكتبت البيعة في الدفتر: «كيكة — 150 ريال». واضح وسهل. أو هكذا بدا. 3/20","55 ريالًا للمكونات خرجت من المطبخ، لكن الدفتر لم يرها كلها. 4/20","علبة وشريطة وقاعدة: 15 ريالًا أخرى. صغيرة وحدها، مؤثرة مع كل طلب. 5/20","التوصيل أخذ 20 ريالًا. الطلب وصل، لكن الربح ابتعد. 6/20","فرن، كهرباء، وقطعة تالفة: 10 ريالات لا تظهر في سطر البيع. 7/20","على الورق: 150 − 55 = 95 ريال ربح. حسبة تبدو صحيحة لأنها ناقصة. 8/20","بعد كل التكاليف، بقي 50 ريالًا. هذا الرقم الذي يساعدك على التسعير بوعي. 9/20","ثم اكتشفنا أن جزءًا من المبلغ لم يُدفع أصلًا. رسالة «أحوّل لك بكرة» ضاعت بين المحادثات. 10/20","وفي الطلب التالي، انتهى الكاكاو. المخزون كان محفوظًا في الذاكرة. والذاكرة كانت مشغولة. 11/20","ورقة للمبيعات. واتساب للدفعات. إيصال للمصاريف. ملاحظات للمخزون. والباقي في الذاكرة. 12/20","في نهاية الشهر بقي السؤال: بعت كثير… لكن هل ربحت؟ 13/20","المشكلة لم تكن في صاحب المشروع. المشكلة أن مشروعًا واحدًا صار له خمس نسخ من أرقامه. 14/20","ماذا لو اجتمعت القصة كلها في مكان واحد؟ مكان مألوف مثل الدفتر، لكنه لا ينسى. 15/20","في «دفتر»، تسجّل البيعة مع الزبون وحالة الدفع في مكان واحد. 16/20","وتسجّل كل مصروف: المكونات، التغليف، التوصيل، والتشغيل. 17/20","المدفوع واضح. والباقي أوضح. فلا تبحث آخر الشهر بين عشرات المحادثات. 18/20","حين تجتمع المبيعات والمصاريف والفواتير والمخزون، يصبح قرارك أسرع وصورتك أوضح. 19/20","المفاجأة؟ لم نطلب منك ترك الدفتر. جعلناه أذكى.\n\n«دفتر» — حساباتك، بلغتك.\nابدأ مجانًا: https://daftar1.com/?utm_source=x&utm_medium=organic&utm_campaign=visual_thread_20 20/20"];let i=0;const main=document.getElementById('main'),count=document.getElementById('count'),cap=document.getElementById('cap'),thumbs=document.getElementById('thumbs');for(let n=0;n<20;n++){const b=document.createElement('button'),im=document.createElement('img');im.src='png/'+String(n+1).padStart(2,'0')+'.png';b.append(im);b.onclick=()=>go(n);thumbs.append(b)}function go(n){i=(n+20)%20;main.src='png/'+String(i+1).padStart(2,'0')+'.png';main.alt='الصورة '+(i+1)+' من 20';count.textContent=(i+1)+'/20';cap.textContent=tweets[i];[...thumbs.children].forEach((b,j)=>b.classList.toggle('on',j===i));thumbs.children[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}prev.onclick=()=>go(i-1);next.onclick=()=>go(i+1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i-1);if(e.key==='ArrowLeft')go(i+1)});go(0);
</script></body></html>
